# Central default configuration for llm-benchmark.
# CLI flags always override these values.

model_path = "../../models/llm/Qwen2.5-3B-Instruct-Q4_K_M.gguf"
prompts = [
  "You are a concise assistant. Answer in one short paragraph.",
  "Summarize the benefits and tradeoffs of local LLM inference in 6 bullet points.",
  "Write a short troubleshooting checklist for high TTFT and unstable token cadence.",
]
iterations = 3
n_threads = 3
gpu_layers = 0
max_tokens = 128
cooldown_secs = 2.0
output = "report.json"
jsonl_output = "report.flow.jsonl"
seed = 1234
sampler = "greedy"
temperature = 0.8
top_k = 40
top_p = 0.95
timeout_secs = 30.0
