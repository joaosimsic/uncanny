services:
  llama-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ryzen5-llama-env
    cpus: 2.0
    mem_limit: 4g
    memswap_limit: 4g
    stdin_open: true
    tty: true
    volumes:
      - ./models:/app/models:ro
    command:
      [
        "--model",
        "/app/models/Llama-3.2-1B-Instruct-Q4_K_M.gguf",
        "--no-chat",
        "--threads",
        "2",
        "--ctx-size",
        "1024",
        "--n-predict",
        "64",
        "--prompt",
        "Explain 4-bit quantization in one short paragraph.",
      ]
